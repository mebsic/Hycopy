<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="title description"><title id="title">Hycopy network architecture</title><desc id="description">A Minecraft client connects to Velocity on port 25565. Velocity routes to Paper hubs, games, and build servers. MongoDB and Redis provide shared data and coordination.</desc><rect width="760" height="380" rx="20" fill="#f8f7f3"/><g fill="none" stroke="#c2beb3" stroke-width="2"><path d="M380 80v25m0 55v30M130 190h500m-500 0v25m250-25v25m250-25v25M130 270v25h500v-25m-250 25v25"/></g><g font-family="system-ui,sans-serif" text-anchor="middle"><rect x="267" y="25" width="226" height="55" rx="12" fill="#fff" stroke="#e2ded2"/><text x="380" y="58" font-size="17" fill="#33372f">Minecraft Java client</text><rect x="267" y="105" width="226" height="55" rx="12" fill="#f5dfaa" stroke="#daba7e"/><text x="380" y="137" font-size="17" font-weight="600" fill="#514027">Velocity · :25565</text><g fill="#fff" stroke="#e2ded2"><rect x="30" y="215" width="200" height="55" rx="12"/><rect x="280" y="215" width="200" height="55" rx="12"/><rect x="530" y="215" width="200" height="55" rx="12"/></g><g font-size="17" fill="#33372f"><text x="130" y="249">Paper · hubs</text><text x="380" y="249">Paper · games</text><text x="630" y="249">Paper · build</text></g><rect x="220" y="320" width="320" height="40" rx="10" fill="#e3ebdf" stroke="#c4d0bf"/><text x="380" y="346" font-size="15" fill="#38543a">MongoDB + Redis · shared services</text><text x="515" y="179" font-size="12" fill="#747769">registry discovery + routing</text></g></svg>
