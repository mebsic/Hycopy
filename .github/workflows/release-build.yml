name: Plugin Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build and publish plugins
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build shaded plugin jars
        run: ./gradlew shadowAll --no-daemon

      - name: Collect release artifacts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-artifacts
          cp docker/development/plugins/Hycopy.jar release-artifacts/
          cp docker/development/plugins/MurderMystery.jar release-artifacts/
          cp docker/development/plugins/HycopyBuild.jar release-artifacts/
          cp docker/development/plugins/HycopyProxy.jar release-artifacts/

          if [[ -f docker/development/plugins/Citizens-2.0.30-b2924.jar ]]; then
            cp docker/development/plugins/Citizens-2.0.30-b2924.jar release-artifacts/
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: hycopy-plugins
          path: release-artifacts/*
          if-no-files-found: error

      - name: Publish latest build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag="latest-build"
          title="Latest Build"
          notes="Automated plugin build from ${GITHUB_REF_NAME} at commit ${GITHUB_SHA}."

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${tag}" "${GITHUB_SHA}"
          git push --force origin "refs/tags/${tag}"

          if gh release view "${tag}" >/dev/null 2>&1; then
            release_id="$(gh release view "${tag}" --json databaseId --jq '.databaseId')"
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -f name="${title}" \
              -f body="${notes}" \
              -f target_commitish="${GITHUB_SHA}" \
              -F draft=false \
              -F prerelease=false \
              -f make_latest=true

            gh release view "${tag}" --json assets --jq '.assets[].name' | while IFS= read -r asset_name; do
              if [[ -n "${asset_name}" ]]; then
                gh release delete-asset "${tag}" "${asset_name}" --yes
              fi
            done

            gh release upload "${tag}" release-artifacts/*
          else
            gh release create "${tag}" release-artifacts/* \
              --target "${GITHUB_SHA}" \
              --title "${title}" \
              --notes "${notes}" \
              --latest
          fi
